name: API tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    env:
      PORT: 3000
      ADMIN_SECRET: test-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Запуск сервера
        run: |
          npm start > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:3000/api/health && exit 0; sleep 1; done
          cat server.log; exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt

      - name: pytest
        run: pytest -v

      - name: Логи сервера при падении
        if: failure()
        run: cat server.log
